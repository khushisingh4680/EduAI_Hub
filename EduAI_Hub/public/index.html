<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduAI Hub - AI-powered student productivity and learning toolkit">
  <title>EduAI Hub — AI Student Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <header class="topbar">
    <a class="brand" href="#home" data-route="home">
      <span class="brand-mark">✦</span>
      <span>EduAI <b>Hub</b></span>
    </a>
    <nav>
      <a href="#home" data-route="home">Home</a>
      <a href="#tools" data-route="tools">Tools</a>
      <a href="#about" data-route="about">About</a>
    </nav>
    <button class="key-btn" id="keyStatusBtn">⚿ API Status</button>
  </header>

  <main id="app"></main>

  <footer>
    <span>EduAI Hub · AI-powered student productivity & learning</span>
    <span>Built with HTML · CSS · JavaScript · Node.js · Gemini</span>
  </footer>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
